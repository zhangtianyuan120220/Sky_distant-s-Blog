<style>
/* 浅色模式下：将代码块背景调为极浅的灰蓝色 (#f6f8fa)，并强化文字颜色 */
html[data-scheme="light"] .highlight,
html[data-scheme="light"] div.highlight,
html[data-scheme="light"] .chroma,
html[data-scheme="light"] pre {
    background-color: #f6f8fa !important;
    border: 1px solid #e1e4e8 !important;
    border-radius: 8px !important;
}

/* 强制修正浅色模式下代码字符的颜色，确保变量名和数字清晰显示 */
html[data-scheme="light"] .chroma {
    color: #24292e !important;
}

/* 深色模式下：保持深色高对比度 (#1e1e1e) */
html[data-scheme="dark"] .highlight,
html[data-scheme="dark"] div.highlight,
html[data-scheme="dark"] .chroma,
html[data-scheme="dark"] pre {
    background-color: #1e1e1e !important;
    border: 1px solid #2d2d2d !important;
    border-radius: 8px !important;
    color: #e6edf3 !important;
}

/* 行内代码微调 */
:not(pre) > code {
    background-color: rgba(175, 184, 193, 0.2) !important;
    padding: 2px 6px !important;
    border-radius: 4px !important;
}
</style>

<script>
(function() {
    const targetUrl = "/Sky_distant-s-Blog/index.json";
    const _fetch = window.fetch;
    window.fetch = function(resource, config) {
        let url = typeof resource === 'string' ? resource : (resource ? resource.url : '');
        if (!url || url.includes('undefined')) {
            resource = targetUrl;
        }
        return _fetch.call(this, resource, config);
    };
})();
</script>
