<style>
/* 采用更浅柔的莫兰迪灰/冷烟灰背景，不突兀且清晰 */
.highlight, div.highlight, .chroma, pre {
    background-color: #3b4252 !important;
    border-radius: 8px !important;
}

/* 浅色模式下：加上极浅柔和的边框与淡阴影 */
html[data-scheme="light"] .highlight,
html[data-scheme="light"] div.highlight,
html[data-scheme="light"] .chroma {
    border: 1px solid #d8dee9 !important;
    box-shadow: 0 4px 10px rgba(0,0,0,0.05) !important;
}

/* 深色模式下：保持无缝融合 */
html[data-scheme="dark"] .highlight,
html[data-scheme="dark"] div.highlight,
html[data-scheme="dark"] .chroma {
    border: 1px solid #2e3440 !important;
}

/* 行内小代码块样式 */
:not(pre) > code {
    background-color: rgba(223, 226, 229, 0.4) !important;
    color: #d08770 !important;
    padding: 2px 6px !important;
    border-radius: 4px !important;
}
</style>

<script>
(function() {
    const targetUrl = "/Sky_distant-s-Blog/index.json";
    const _fetch = window.fetch;
    window.fetch = function(resource, config) {
        let url = typeof resource === 'string' ? resource : (resource ? resource.url : '');
        if (!resource || !url || url.includes('undefined')) {
            arguments[0] = targetUrl;
        }
        return _fetch.apply(this, arguments);
    };
})();
</script>
