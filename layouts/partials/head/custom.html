<link rel="icon" href="/favicon.ico" sizes="any">
<style>
/* 莫兰迪灰背景代码块 */
.highlight, div.highlight, .chroma, pre {
    background-color: #3b4252 !important;
    border-radius: 8px !important;
    position: relative !important;
}

/* 浅色与深色模式边框 */
html[data-scheme="light"] .highlight,
html[data-scheme="light"] div.highlight,
html[data-scheme="light"] .chroma {
    border: 1px solid #d8dee9 !important;
    box-shadow: 0 4px 10px rgba(0,0,0,0.05) !important;
}
html[data-scheme="dark"] .highlight,
html[data-scheme="dark"] div.highlight,
html[data-scheme="dark"] .chroma {
    border: 1px solid #2e3440 !important;
}

/* 优化 Copy 按钮样式 */
.highlight .copyCodeButton, pre .copyCodeButton {
    background-color: rgba(255, 255, 255, 0.15) !important;
    color: #eceff4 !important;
    border: none !important;
    border-radius: 4px !important;
    padding: 3px 8px !important;
    font-size: 12px !important;
    cursor: pointer !important;
    transition: all 0.2s ease !important;
    position: absolute !important;
    top: 8px !important;
    right: 8px !important;
    z-index: 10 !important;
}

.highlight .copyCodeButton:hover, pre .copyCodeButton:hover {
    background-color: rgba(255, 255, 255, 0.3) !important;
    color: #ffffff !important;
}

.highlight .copyCodeButton:empty::before, pre .copyCodeButton:empty::before {
    content: "复制";
}

/* 行内代码样式 */
:not(pre) > code {
    background-color: rgba(223, 226, 229, 0.4) !important;
    color: #d08770 !important;
    padding: 2px 6px !important;
    border-radius: 4px !important;
}
</style>

<script>
(function() {
    // 自定义域名根目录下的搜索索引路径
    const targetUrl = "/index.json";
    const _fetch = window.fetch;
    window.fetch = function(resource, config) {
        let url = typeof resource === 'string' ? resource : (resource ? resource.url : '');
        if (!resource || !url || url.includes('undefined') || url.includes('Sky_distant-s-Blog')) {
            arguments[0] = targetUrl;
        }
        return _fetch.apply(this, arguments);
    };

    // 复制按钮点击互动
    document.addEventListener('click', function(e) {
        const btn = e.target.closest('.copyCodeButton');
        if (!btn) return;

        const codeBlock = btn.closest('.highlight, pre');
        if (codeBlock) {
            const code = codeBlock.querySelector('code')?.innerText || codeBlock.innerText;
            navigator.clipboard.writeText(code).then(() => {
                const oldText = btn.textContent;
                btn.textContent = '已复制！';
                btn.style.backgroundColor = '#a3be8c';
                btn.style.color = '#2e3440';
                setTimeout(() => {
                    btn.textContent = oldText || '复制';
                    btn.style.backgroundColor = '';
                    btn.style.color = '';
                }, 1800);
            }).catch(() => {});
        }
    });
})();
</script>
