<script>
(function() {
    // 1. 拦截 Fetch
    const originalFetch = window.fetch;
    window.fetch = function(input, init) {
        if (typeof input === 'string' && input.includes('index.json')) {
            if (!input.includes('Sky_distant-s-Blog')) {
                input = '/Sky_distant-s-Blog/index.json';
            }
        }
        return originalFetch.apply(this, arguments);
    };

    // 2. 拦截 XMLHttpRequest (XHR)
    const originalOpen = XMLHttpRequest.prototype.open;
    XMLHttpRequest.prototype.open = function(method, url) {
        if (typeof url === 'string' && url.includes('index.json')) {
            if (!url.includes('Sky_distant-s-Blog')) {
                url = '/Sky_distant-s-Blog/index.json';
            }
        }
        return originalOpen.apply(this, [method, url]);
    };
})();
</script>
