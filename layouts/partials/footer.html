<!-- 自定义静态逻辑整合：1. VuePress 容器渲染 2. 数学公式二次渲染 3. 搜索 API 路径劫持 -->
<script>
(function() {
    // ==========================================
    // 1. 全局渲染 VuePress/VitePress 风格容器 (Callout)
    // ==========================================
    document.addEventListener("DOMContentLoaded", function() {
        // 获取文章主体区域，适配绝大多数 Hugo 主题的选择器
        const container = document.querySelector('article') || 
                          document.querySelector('.post-content') || 
                          document.querySelector('.single-content') || 
                          document.querySelector('.entry-content') ||
                          document.body;
        if (!container) return;

        // 正则解析匹配 :::type[title] ... ::: 语法（支持自动剥离外层 <p> 标签）
        const regex = /(?:<p>)?:::(\w+)(?:\[(.*?)\])?[\r\n]+([\s\S]*?):::(?:<\/p>)?/g;

        container.innerHTML = container.innerHTML.replace(regex, function(match, type, title, content) {
            const displayTitle = title || type.toUpperCase();
            return `
              <div class="custom-callout callout-${type.toLowerCase()}">
                <div class="callout-title">${displayTitle}</div>
                <div class="callout-body">${content}</div>
              </div>
            `;
        });

        // 若页面加载了 KaTeX 数学公式库，对渲染后的 Callout 容器重新触发渲染以确保公式正常显示
        if (typeof renderMathInElement === 'function') {
            renderMathInElement(container);
        }
    });

    // ==========================================
    // 2. 劫持并重定向搜索 JSON 请求路径
    // ==========================================
    const targetJSON = "https://zhangtianyuan120220.github.io/Sky_distant-s-Blog/index.json";

    // 劫持全局 Fetch API
    const originalFetch = window.fetch;
    window.fetch = function(input, init) {
        let url = '';
        if (typeof input === 'string') url = input;
        else if (input && input.url) url = input.url;

        if (!url || url.includes('undefined') || url.endsWith('/index.json') || url === 'index.json' || url.includes('search.json')) {
            if (typeof input === 'string') {
                arguments[0] = targetJSON;
            } else if (input && input.url) {
                arguments[0] = new Request(targetJSON, init);
            }
        }
        return originalFetch.apply(this, arguments);
    };

    // 劫持全局 XMLHttpRequest (XHR)
    const originalOpen = XMLHttpRequest.prototype.open;
    XMLHttpRequest.prototype.open = function(method, url) {
        if (!url || url.includes('undefined') || url.endsWith('/index.json') || url === 'index.json' || url.includes('search.json')) {
            arguments[1] = targetJSON;
        }
        return originalOpen.apply(this, arguments);
    };
})();
</script>
