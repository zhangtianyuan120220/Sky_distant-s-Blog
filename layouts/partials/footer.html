<script>
window.baseURL = "{{ .Site.BaseURL }}";
(function() {
    const targetJSON = "{{ "index.json" | absURL }}";
    const originalFetch = window.fetch;
    window.fetch = function(input, init) {
        if (!input || input === 'undefined' || (typeof input === 'string' && (input.includes('index.json') || input.includes('undefined')))) {
            arguments[0] = targetJSON;
        }
        return originalFetch.apply(this, arguments);
    };
    const originalOpen = XMLHttpRequest.prototype.open;
    XMLHttpRequest.prototype.open = function(method, url) {
        if (!url || url === 'undefined' || (typeof url === 'string' && (url.includes('index.json') || url.includes('undefined')))) {
            arguments[1] = targetJSON;
        }
        return originalOpen.apply(this, arguments);
    };
})();
</script>
