baseURL = "https://openmc.qzz.io/"
locale = "zh-cn"
title = "Sky_distant's Blog"
theme = "stack"

buildFuture = true
buildDrafts = true

[params]
    favicon = "favicon.ico"
    
    [params.search]
        enabled = true

    [params.colorScheme]
        enabled = true
        default = "auto"

    [params.sidebar]
        avatar = "/img/avatar.png"
        subtitle = "Sky_distant的个人记录"

[outputs]
    home = [ "HTML", "JSON" ]
    page = [ "HTML" ]
    section = [ "HTML" ]

[outputFormats.JSON]
    mediatype = "application/json"
    baseName = "index"
    isPlainText = true
